name = "techops-hub-cloudflare"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "production"

# Hyperdrive configuration for Neon PostgreSQL acceleration at the Edge (Optional)
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-id>"

# Cloudflare D1 Serverless Database (Optional)
# [[d1_databases]]
# binding = "DB"
# database_name = "techops_db"
# database_id = "<your-d1-database-id>"
